name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc-[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev-[0-9]+'

permissions:
  contents: write # create the release and upload archives

env:
  GO_VERSION: '1.27'

jobs:
  release:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are generated from history

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Resolve Version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
          # -rc- and -dev- tags are prereleases, so `brew` and the Releases page
          # do not offer them as the current version.
          if [[ "$tag" == *-rc-* || "$tag" == *-dev-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: go test -race ./...

      # The workspace daemon is a SEPARATE, PRIVATE repository, and it is
      # deliberately not a dependency of this module — see the Public
      # Buildability job in ci.yaml. A release ships it as a COMPILED binary, so
      # nothing of its source is published.
      #
      # This step FAILS the release when the token is missing rather than
      # shipping without it. An archive lacking sctxd installs cleanly and leaves
      # `sctx watch` broken, which is the exact failure mode that is impossible to
      # notice from the outside.
      # A bare 404 from `checkout` cannot distinguish an invalid token from a
      # valid one that was never granted the repository, and those have different
      # fixes. This asks the token what it can actually see and says so, so the
      # next person spends a minute rather than an afternoon.
      - name: Mint a GitHub App token (read)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SCT__GITHUB_CI_APP_ID }}
          private-key: ${{ secrets.SCT__GITHUB_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # WHY THIS STEP STILL EXISTS. A bare 404 from `checkout` cannot tell a
      # missing credential from an App that is simply not installed on the
      # repository being fetched, and those have different fixes. This asks the
      # token what it can actually reach and says so.
      #
      # Rewritten for a GitHub App. The previous version called `gh api user` and
      # read the X-OAuth-Scopes header: an INSTALLATION TOKEN HAS NEITHER -- it
      # does not act as a user and carries no OAuth scopes, so both checks failed
      # for a perfectly good token. /installation/repositories is the App
      # equivalent and is strictly better: it returns exactly the repositories
      # this token can reach, rather than being inferred from org membership.
      - name: Verify App Access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No App token was minted. Check SCT__GITHUB_CI_APP_ID and"
            echo "  SCT__GITHUB_CI_APP_PRIVATE_KEY are visible to this repository."
            exit 1
          fi

          if ! reachable=$(gh api /installation/repositories --paginate -q '.repositories[].name' 2>/dev/null); then
            echo "::error::the App token was rejected by GitHub."
            echo "  Most likely the private key does not match SCT__GITHUB_CI_APP_ID."
            exit 1
          fi
          echo "repositories this installation can reach: $(echo $reachable | tr '\n' ' ')"

          # Both are needed BEFORE the build: workspace-delta-daemon carries a
          # relative `replace` to platform-contracts, so discovering the second
          # one during `go build` wastes a whole run.
          fail=0
          for repo in workspace-delta-daemon platform-contracts; do
            if printf '%s\n' "$reachable" | grep -qx "$repo"; then
              echo "  can read synapctx/$repo"
            else
              echo "::error::the synapctx-ci App is not installed on synapctx/$repo."
              echo "  Add it under the App's Repository access."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Checkout Workspace Daemon
        uses: actions/checkout@v7
        with:
          repository: synapctx/workspace-delta-daemon
          token: ${{ steps.app-token.outputs.token }}
          path: .workspace-daemon

      # platform-contracts holds the SHARED Go extractor the daemon links, and the
      # daemon's go.mod reaches it with a relative `replace` of
      # ../../platform-contracts. From .workspace-daemon/app that resolves to the
      # workspace root, so the path below is dictated by that directive rather
      # than chosen — moving it silently breaks the build with a missing
      # replacement directory.
      - name: Checkout Platform Contracts
        uses: actions/checkout@v7
        with:
          repository: synapctx/platform-contracts
          token: ${{ steps.app-token.outputs.token }}
          path: platform-contracts

      - name: Build Archives
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.version.outputs.tag }}
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            stage="dist/stage-$os-$arch"
            mkdir -p "$stage"

            # Windows needs the extension, or the binary is not executable.
            ext=""
            [ "$os" = "windows" ] && ext=".exe"

            # `$stage` is relative to the workspace root, and this build now runs
            # there rather than inside app/ — so the output path lost a `../`
            # when the module moved to the repository root.
            ( GOOS="$os" GOARCH="$arch" \
                go build -ldflags "-s -w -X main.version=$VERSION" -o "$stage/sctx$ext" ./cmd/sctx )
            ( cd .workspace-daemon/app && GOOS="$os" GOARCH="$arch" \
                go build -ldflags "-s -w" -o "../../$stage/sctxd$ext" ./cmd/sctxd )

            # The licence travels in the archive: an install from the archive is
            # the only thing some users ever see, so the terms ship with it.
            cp LICENSE.txt README.md "$stage/"

            # Archives are FLAT (no leading directory): Homebrew's bin.install
            # expects the binaries at the root, and it keeps the manual install a
            # single copy. Windows gets .zip because a tarball there is a tool
            # requirement rather than a convention.
            if [ "$os" = "windows" ]; then
              ( cd "$stage" && zip -qr "../sctx_${NUMBER}_${os}_${arch}.zip" . )
            else
              tar -czf "dist/sctx_${NUMBER}_${os}_${arch}.tar.gz" \
                -C "$stage" sctx sctxd LICENSE.txt README.md
            fi
            rm -rf "$stage"
          done
          ( cd dist && shasum -a 256 *.tar.gz *.zip > checksums.txt )
          ls -l dist

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

      - name: Upload Archives as Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sctx-${{ steps.version.outputs.tag }}
          path: dist/*
          retention-days: 14

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    # Stable releases only. A tap pointing at a release candidate would hand
    # `brew install sctx` to users who did not ask to test one.
    if: '!contains(github.ref, ''-rc-'') && !contains(github.ref, ''-dev-'')'
    steps:
      - name: Resolve Version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      # The RELEASE App, not the CI one. This job pushes a commit to
      # synapctx/homebrew-tap, and that is the only write in the whole estate --
      # which is why it is a separate App scoped to that one repository. The CI
      # App is Contents:Read everywhere and could not do this even if used.
      - name: Mint a GitHub App token (write, tap only)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SCT__GITHUB_RELEASE_APP_ID }}
          private-key: ${{ secrets.SCT__GITHUB_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Checkout Tap
        uses: actions/checkout@v7
        with:
          repository: synapctx/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Generate Formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NUMBER: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # Checksums come from the release just published, so the formula can
          # never disagree with the archives it points at.
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          sha() { awk -v f="sctx_${NUMBER}_$1.tar.gz" '$2 == f || $2 == "*"f {print $1}' checksums.txt; }

          for target in darwin_arm64 darwin_amd64 linux_amd64 linux_arm64; do
            if [ -z "$(sha "$target")" ]; then
              echo "::error::no checksum for $target; refusing to write a formula that cannot verify."
              exit 1
            fi
          done

          mkdir -p tap/Formula
          cat > tap/Formula/sctx.rb <<FORMULA
          # Generated by the sctx release workflow. Do not hand-edit.
          class Sctx < Formula
            desc "Token-optimizing command wrapper for AI coding agents"
            homepage "https://synapctx.com/sctx/"
            # No explicit `version`: Homebrew scans it from the archive URL, and
            # `brew audit` reports a hardcoded one as redundant. Verified that the
            # scan yields the right value rather than assumed.
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/sctx_${NUMBER}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin_arm64)"
              end
              on_intel do
                url "${base}/sctx_${NUMBER}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/sctx_${NUMBER}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/sctx_${NUMBER}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end

            def install
              # Both binaries, into the same bin: \`sctx watch\` looks beside its own
              # executable first, so the helper it shipped with wins over any older
              # copy elsewhere on PATH.
              bin.install "sctx"
              bin.install "sctxd"
            end

            def caveats
              <<~EOS
                Tell the AI coding agents you use that sctx is available:
                  sctx setup --install

                Everything works without an account. To connect one:
                  sctx init
              EOS
            end

            test do
              assert_match "sctx", shell_output("#{bin}/sctx version")
              # sctxd is launched by \`sctx watch\` and reads its configuration on
              # stdin; given none it must refuse rather than wait for input.
              assert_match "sctxd", shell_output("#{bin}/sctxd </dev/null 2>&1", 2)
            end
          end
          FORMULA
          sed -i 's/^          //' tap/Formula/sctx.rb
          cat tap/Formula/sctx.rb

      - name: Commit Formula
        working-directory: tap
        run: |
          # The formula must EXIST. If generation failed quietly there is nothing
          # to commit, and "nothing to commit" must never read as success.
          if [ ! -f Formula/sctx.rb ]; then
            echo "::error::Formula/sctx.rb was not generated."
            exit 1
          fi

          git config user.name "synapctx-bot"
          git config user.email "bot@synapctx.com"

          # STAGE FIRST, then compare the index against HEAD.
          #
          # `git diff` alone does not see UNTRACKED files, so on the first release
          # into a fresh tap the brand-new formula read as "unchanged" and this job
          # went green having pushed nothing — a released version with no way to
          # install it. Comparing the index is what makes a new file visible.
          git add Formula/sctx.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push."
            exit 0
          fi

          git commit -m "sctx ${{ steps.version.outputs.tag }}"
          git push

          # Assert the push landed. This job's whole purpose is that a formula is
          # reachable afterwards, and every step before this one can succeed
          # without that being true.
          git fetch -q origin
          if ! git diff --quiet HEAD origin/HEAD -- Formula/sctx.rb; then
            echo "::error::the pushed formula does not match the remote."
            exit 1
          fi
          echo "formula published: $(git rev-parse --short HEAD)"
